# Production compose file — used ON THE VPS ONLY.
# Unlike docker-compose.yml (local build), this pulls the prebuilt image
# that CI already built and pushed to GHCR; the VPS never runs `npm`/`vite`.
#
# Routed through the existing Traefik instance (root-traefik-1) at
# music.autopilot-studio.com, the same way helios/n8n are — Host-header
# routing on 80/443, no separate host port needed since Traefik reaches
# this container directly over the shared `app-network` Docker network.
#
# One-time VPS setup:
#   1. mkdir -p /opt/auraflow && cd /opt/auraflow
#   2. Copy this file there as docker-compose.prod.yml
#   3. cp .env.example .env   # adjust IMAGE if needed
#   4. docker compose -f docker-compose.prod.yml up -d
#      (no `docker login` needed — the GHCR package is public)
#
# After that, CI's deploy.yml SSHes in and runs `pull` + `up -d` on every
# push to main — see .github/workflows/deploy.yml.

services:
  auraflow:
    image: ${IMAGE:-ghcr.io/madhavagarwal12/music-soothing-vps:latest}
    container_name: auraflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=app-network"
      - "traefik.http.routers.auraflow.rule=Host(`music.autopilot-studio.com`)"
      - "traefik.http.routers.auraflow.entrypoints=web,websecure"
      - "traefik.http.routers.auraflow.tls=true"
      - "traefik.http.routers.auraflow.tls.certresolver=mytlschallenge"
      - "traefik.http.services.auraflow.loadbalancer.server.port=8080"

    # Uncomment if you also want to hit the container directly on the host
    # (bypassing Traefik/TLS) for debugging — not needed for normal use.
    # ports:
    #   - "${HOST_PORT:-8080}:8080"

networks:
  app-network:
    external: true
