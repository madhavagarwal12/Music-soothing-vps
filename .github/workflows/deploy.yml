name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            # Keep docker-compose.prod.yml in sync with the repo — `pull`
            # only refreshes the image, not this file, so without this the
            # VPS silently runs a stale compose config (labels, networks,
            # etc.) after any change to the file itself.
            curl -fsSL -o docker-compose.prod.yml \
              https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml
            # The GHCR package is public, so no docker login is needed to pull it.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Post-deploy smoke check (container-internal)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            sleep 5
            # No host port is published (Traefik reaches the container over
            # app-network directly), so check via docker exec instead of
            # curling a host-bound port.
            docker exec auraflow curl -f http://127.0.0.1:8080/health

      - name: Post-deploy smoke check (public URL through Traefik)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://music.autopilot-studio.com/ -o /dev/null; then
              echo "music.autopilot-studio.com is reachable"
              exit 0
            fi
            echo "Attempt $i: not reachable yet, retrying in 6s..."
            sleep 6
          done
          echo "music.autopilot-studio.com did not become reachable in time" >&2
          exit 1
